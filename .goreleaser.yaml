# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: squidgate
    main: ./cmd/squidgate
    binary: squidgate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: squidgate
    ids:
      - squidgate
    formats:
      - tar.gz
    name_template: "squidgate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - docs/squidgate.md
      - docs/squidgate/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore"

release:
  prerelease: auto
